name: Verify

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  # Lets a run be re-triggered by hand. On 2026-08-06 a run failed with "the
  # job was not acquired by Runner of type hosted" after 15 minutes, and the
  # two pushes after it produced no run at all — leaving a PR with no CI result
  # and no way to ask for one short of an empty commit.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Backstop. A green run takes about 6 minutes; the default ceiling is 6
    # hours, which is how a hung apt step sat for 22 minutes on 2026-08-19
    # before a human noticed and cancelled it by hand.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the resolved Playwright version, not the lockfile hash: the
      # browser build is tied to that version and nothing else, so an
      # unrelated dependency bump must not throw away a still-valid cache.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Split on purpose. The browser binary is cacheable; the apt system
      # libraries are not, because they install outside the cached path. On a
      # hit we therefore still need `install-deps`, but skip the ~150 MB
      # download. On a miss we do both, exactly as before.
      - name: Install Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      # `install-deps` shells out to `apt-get`, and the runner image runs its
      # own apt job at boot (unattended-upgrades). When the two collide this
      # step blocks on the lock:
      #
      #   E: Could not get lock /var/lib/apt/lists/lock.
      #      It is held by process NNNN (apt-get)
      #
      # That is contention, not an unreachable mirror — the step normally
      # finishes in 13-19 seconds, but on 2026-08-19 it sat for 22 minutes
      # three times running and had to be cancelled by hand each time.
      #
      # `DPkg::Lock::Timeout` makes apt WAIT for the lock and then proceed,
      # which is the actual remedy; killing it mid-wait (the first attempt at
      # this fix) just guaranteed the retry hit the same held lock. The
      # retries below cover the case where the boot job outlasts even that.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: |
          echo 'DPkg::Lock::Timeout "180";' \
            | sudo tee /etc/apt/apt.conf.d/99lock-timeout > /dev/null

          for attempt in 1 2 3; do
            if npx playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::install-deps attempt $attempt failed; the runner's own apt job may still hold the lock"
            sleep 30
          done

          echo "::error::playwright install-deps failed three times — see the apt output above for whether this is a held lock or a real package failure" >&2
          exit 1

      # `next build` reuses this to skip recompiling unchanged modules. The
      # restore-keys fall back to the newest cache for the same lockfile, so a
      # source edit still starts from the last build rather than from cold.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run verification
        run: npm run verify

name: Verify

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  # Lets a run be re-triggered by hand. On 2026-08-06 a run failed with "the
  # job was not acquired by Runner of type hosted" after 15 minutes, and the
  # two pushes after it produced no run at all — leaving a PR with no CI result
  # and no way to ask for one short of an empty commit.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Backstop. A green run takes about 6 minutes; the default ceiling is 6
    # hours, which is how a hung apt step sat for 22 minutes on 2026-08-19
    # before a human noticed and cancelled it by hand.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the resolved Playwright version, not the lockfile hash: the
      # browser build is tied to that version and nothing else, so an
      # unrelated dependency bump must not throw away a still-valid cache.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Split on purpose. The browser binary is cacheable; the apt system
      # libraries are not, because they install outside the cached path. On a
      # hit we therefore still need `install-deps`, but skip the ~150 MB
      # download. On a miss we do both, exactly as before.
      - name: Install Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      # `install-deps` is an `apt-get` against Ubuntu's mirrors, and it is the
      # only network-dependent apt call in this pipeline. It normally takes
      # 13-19 seconds. Twice on 2026-08-19 it hung instead — once for 22
      # minutes — blocking a PR that was otherwise ready and costing a manual
      # cancel-and-rerun each time. Both retries then passed untouched, so the
      # failure is the mirror, not this repository.
      #
      # One bounded retry turns a hang into a ~90-second blip. The step still
      # fails if apt is genuinely broken twice, rather than pretending the
      # libraries are present.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if timeout 90 npx playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps attempt $attempt hung or failed; retrying"
            sleep 5
          done
          echo "::error::playwright install-deps failed twice — apt mirrors are unreachable" >&2
          exit 1

      # `next build` reuses this to skip recompiling unchanged modules. The
      # restore-keys fall back to the newest cache for the same lockfile, so a
      # source edit still starts from the last build rather than from cold.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run verification
        run: npm run verify

name: Verify

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  # Lets a run be re-triggered by hand. On 2026-08-06 a run failed with "the
  # job was not acquired by Runner of type hosted" after 15 minutes, and the
  # two pushes after it produced no run at all — leaving a PR with no CI result
  # and no way to ask for one short of an empty commit.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run verification
        run: npm run verify

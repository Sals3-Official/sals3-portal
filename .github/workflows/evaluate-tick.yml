# BREAK-GLASS RECOVERY ONLY - no schedule (ADR-013 §12: "No cron or
# scheduled GitHub Actions tick belongs in the target runtime").
#
# The catalog pipeline runs on a durable Vercel Queues chain started once by
# an owner-authorized POST /api/internal/catalog/discovery/start. This
# manual workflow exists solely to nudge the authenticated recovery route
# (outbox drain + bounded evaluation batch) when the queue chain has stalled
# and the owner wants a hands-off kick from GitHub instead of a direct call.
#
# Requires, set on this repository:
#   - Secret   CRON_SECRET      same value as the Vercel project env var.
#   - Variable PORTAL_BASE_URL  the deployed portal's origin, e.g.
#                                https://sals3-portal.example.com

name: Evaluate Tick (break-glass)

on:
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest

    steps:
      - name: Call the break-glass evaluation tick endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        run: |
          if [ -z "$PORTAL_BASE_URL" ]; then
            echo "PORTAL_BASE_URL repository variable is not set" >&2
            exit 1
          fi

          status=$(curl -sS -o /tmp/tick-response.json -w '%{http_code}' \
            -X GET "$PORTAL_BASE_URL/api/internal/catalog/evaluate-tick" \
            -H "Authorization: Bearer $CRON_SECRET")

          cat /tmp/tick-response.json
          echo

          if [ "$status" -ge 300 ]; then
            echo "evaluate-tick returned HTTP $status" >&2
            exit 1
          fi

# One-time, idempotent DDL — no schedule, manual trigger only.
#
# Creates sals3_product_reviews and sals3_product_review_replies. Same
# break-glass pattern as orders-migrate-line-snapshot.yml and
# taxonomy-migrate-attribute-controls.yml: a manual workflow_dispatch calling an
# authenticated internal route with the shared CRON_SECRET — no Vercel access or
# raw database credential required.
#
# ORDER MATTERS. This runs BEFORE the deployment that reads or writes reviews.
# PR #102 404'd the whole Product Catalogue in production by shipping a feature
# whose migration had only ever run locally. Nothing in the change that adds
# this workflow queries either table, so running this early is safe and running
# it late is not.
#
# The foreign keys reference sals3_order_lines, sals3_orders, and products, so
# each statement runs with a 5s lock_timeout: a lock it cannot get aborts the
# run instead of queueing paid checkout behind DDL. Re-run when quieter.
#
# Requires, set on this repository:
#   - Secret   CRON_SECRET      same value as the Vercel project env var.
#   - Variable PORTAL_BASE_URL  the deployed portal's origin, e.g.
#                                https://sals3-portal.example.com

name: Reviews Migrate Product Reviews

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Call the product-reviews migration endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        run: |
          set -o pipefail

          if [ -z "$PORTAL_BASE_URL" ]; then
            echo "PORTAL_BASE_URL repository variable is not set" >&2
            exit 1
          fi

          endpoint="$PORTAL_BASE_URL/api/internal/reviews/migrate-product-reviews"

          # Read-only first, so the log records the state this run started from.
          echo "--- table state before ---"
          curl -sS "$endpoint" -H "Authorization: Bearer $CRON_SECRET"
          echo

          echo "--- applying migration ---"
          status=$(curl -sS -o /tmp/migrate-response.json -w '%{http_code}' \
            -X POST "$endpoint" \
            -H "Authorization: Bearer $CRON_SECRET")

          cat /tmp/migrate-response.json
          echo

          if [ "$status" -ge 300 ]; then
            echo "product-reviews migration returned HTTP $status" >&2
            echo "Each statement runs in its own transaction with a" >&2
            echo "lock_timeout, so a lock it could not acquire rolled back" >&2
            echo "cleanly and every earlier statement is idempotent." >&2
            echo "Safe to re-run when the database is quieter." >&2
            exit 1
          fi

          # A 200 is not proof. Assert both tables are genuinely there, or fail
          # the run — a migration that reports success without achieving
          # anything is the exact failure this endpoint exists to undo.
          echo "--- verifying tables exist ---"
          if ! grep -q '"tablesExistAfter":{"productReviews":true,"productReviewReplies":true}' /tmp/migrate-response.json; then
            echo "Migration returned HTTP $status but a table is still absent" >&2
            exit 1
          fi

          echo "Verified: sals3_product_reviews and sals3_product_review_replies exist."

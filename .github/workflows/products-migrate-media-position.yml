# One-time, idempotent DDL — no schedule, manual trigger only.
#
# Adds product_media_sources.position -- the seller's own gallery arrangement,
# which is also which photo is the cover: the cover is position 0. Same
# break-glass pattern as products-migrate-media-stored-copy.yml: a manual
# workflow_dispatch calling an authenticated internal route with the shared
# CRON_SECRET — no Vercel access or raw database credential required.
#
# ORDER MATTERS. This runs BEFORE the deployment that lets a seller arrange
# photos. product_media_sources is written by draft creation, by publication, and
# by every seller upload, and Drizzle names every schema column in an INSERT -- so
# a deployment carrying this column before the database has it breaks importing
# and publishing rather than one page. Running this early is safe; running it late
# is an outage.
#
# The column is nullable and nothing is backfilled: null means "never arranged",
# and read paths fall back to the previous order for those rows. So this DDL
# changes nothing a buyer or seller sees until the feature deploys.
#
# Requires, set on this repository:
#   - Secret   CRON_SECRET      same value as the Vercel project env var.
#   - Variable PORTAL_BASE_URL  the deployed portal's origin, e.g.
#                                https://sals3-portal.example.com

name: Products Migrate Media Position

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Call the media-position migration endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        run: |
          set -o pipefail

          if [ -z "$PORTAL_BASE_URL" ]; then
            echo "PORTAL_BASE_URL repository variable is not set" >&2
            exit 1
          fi

          endpoint="$PORTAL_BASE_URL/api/internal/catalog/products/migrate-media-position"

          # Read-only first, so the log records the state this run started from.
          echo "--- column state before ---"
          curl -sS "$endpoint" -H "Authorization: Bearer $CRON_SECRET"
          echo

          echo "--- applying migration ---"
          status=$(curl -sS -o /tmp/migrate-response.json -w '%{http_code}' \
            -X POST "$endpoint" \
            -H "Authorization: Bearer $CRON_SECRET")

          cat /tmp/migrate-response.json
          echo

          if [ "$status" -ge 300 ]; then
            echo "media-position migration returned HTTP $status" >&2
            echo "Nothing was changed: the DDL runs in a transaction with a" >&2
            echo "lock_timeout, so a lock it could not acquire rolls back" >&2
            echo "cleanly. Safe to re-run when the database is quieter." >&2
            exit 1
          fi

          # A 200 is not proof. Assert the column is genuinely there, or fail the
          # run — a migration that reports success without achieving anything is
          # the exact failure this endpoint exists to undo.
          echo "--- verifying column exists ---"
          if ! grep -q '"columnExistsAfter":true' /tmp/migrate-response.json; then
            echo "Migration returned HTTP $status but the column is still absent" >&2
            exit 1
          fi

          echo "Verified: product_media_sources.position exists."

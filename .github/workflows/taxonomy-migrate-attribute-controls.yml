# One-time, idempotent write — no schedule, manual trigger only.
#
# Runs the DDL + seed for category_attribute_dictionary/
# category_attribute_controls/product_category_attribute_values. Same
# break-glass pattern as evaluate-tick.yml, taxonomy-status.yml, and the
# (now-removed) taxonomy-seed-v1.yml: a manual workflow_dispatch calling an
# authenticated internal route with the shared CRON_SECRET — no Vercel
# access or raw database credential required.
#
# Requires, set on this repository:
#   - Secret   CRON_SECRET      same value as the Vercel project env var.
#   - Variable PORTAL_BASE_URL  the deployed portal's origin, e.g.
#                                https://sals3-portal.example.com

name: Taxonomy Migrate Attribute Controls

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Call the attribute-controls migration endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        run: |
          if [ -z "$PORTAL_BASE_URL" ]; then
            echo "PORTAL_BASE_URL repository variable is not set" >&2
            exit 1
          fi

          status=$(curl -sS -o /tmp/migrate-response.json -w '%{http_code}' \
            -X POST "$PORTAL_BASE_URL/api/internal/catalog/taxonomy/migrate-attribute-controls" \
            -H "Authorization: Bearer $CRON_SECRET")

          cat /tmp/migrate-response.json
          echo

          if [ "$status" -ge 300 ]; then
            echo "attribute-controls migration returned HTTP $status" >&2
            exit 1
          fi

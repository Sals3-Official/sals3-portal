# One-time, idempotent write — no schedule, manual trigger only.
#
# Runs the DDL adding checkout_intents.buyer_uid, sals3_orders.buyer_uid and the
# index the buyer order list filters on (drizzle/0033_normal_magus.sql). Same
# break-glass pattern as orders-migrate-shipping-tier.yml: a manual
# workflow_dispatch calling an authenticated internal route with the shared
# CRON_SECRET — no Vercel access or raw database credential required.
#
# Both the checkout accept path and the buyer read model reference these
# columns, so this must be run as soon as the deployment carrying them is live —
# until it runs, accepting a paid order fails with
# `column "buyer_uid" of relation "sals3_orders" does not exist`.
#
# Requires, set on this repository:
#   - Secret   CRON_SECRET      same value as the Vercel project env var.
#   - Variable PORTAL_BASE_URL  the deployed portal's origin.

name: Orders Migrate Buyer Uid

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Call the buyer-uid migration endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        run: |
          set -o pipefail

          if [ -z "$PORTAL_BASE_URL" ]; then
            echo "PORTAL_BASE_URL repository variable is not set" >&2
            exit 1
          fi

          endpoint="$PORTAL_BASE_URL/api/internal/orders/migrate-buyer-uid"

          # Read-only first, so the log records the state this run started from.
          echo "--- schema state before ---"
          curl -sS "$endpoint" -H "Authorization: Bearer $CRON_SECRET"
          echo

          echo "--- applying migration ---"
          status=$(curl -sS -o /tmp/migrate-response.json -w '%{http_code}' \
            -X POST "$endpoint" \
            -H "Authorization: Bearer $CRON_SECRET")

          cat /tmp/migrate-response.json
          echo

          if [ "$status" -ge 300 ]; then
            echo "buyer-uid migration returned HTTP $status" >&2
            echo "Nothing was changed: the DDL runs in one transaction with a" >&2
            echo "lock_timeout, so a lock it could not acquire rolls back" >&2
            echo "cleanly. Safe to re-run when the database is quieter." >&2
            exit 1
          fi

          # A 200 is not proof. Assert the columns are genuinely there, or fail
          # the run — a migration that reports success without achieving
          # anything is the exact failure this endpoint exists to prevent.
          echo "--- verifying both columns exist ---"
          if ! grep -q '"columnsExistAfter":true' /tmp/migrate-response.json; then
            echo "Migration returned HTTP $status but a column is still absent" >&2
            exit 1
          fi

          echo "Verified: checkout_intents.buyer_uid and sals3_orders.buyer_uid exist."

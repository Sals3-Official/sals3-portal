# One-time, idempotent write — no schedule, manual trigger only.
#
# Seeds the Sals3 Taxonomy v1 extraction into sals3_categories. Same
# break-glass pattern as evaluate-tick.yml and taxonomy-status.yml: a manual
# workflow_dispatch calling an authenticated internal route with the shared
# CRON_SECRET — no Vercel access or raw database credential required.
#
# Run taxonomy-status.yml first (or after) to confirm the real row counts.
#
# Requires, set on this repository:
#   - Secret   CRON_SECRET      same value as the Vercel project env var.
#   - Variable PORTAL_BASE_URL  the deployed portal's origin, e.g.
#                                https://sals3-portal.example.com

name: Taxonomy Seed v1

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Call the taxonomy v1 seed endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        run: |
          if [ -z "$PORTAL_BASE_URL" ]; then
            echo "PORTAL_BASE_URL repository variable is not set" >&2
            exit 1
          fi

          status=$(curl -sS -o /tmp/seed-response.json -w '%{http_code}' \
            -X POST "$PORTAL_BASE_URL/api/internal/catalog/taxonomy/seed-v1" \
            -H "Authorization: Bearer $CRON_SECRET")

          cat /tmp/seed-response.json
          echo

          if [ "$status" -ge 300 ]; then
            echo "taxonomy seed returned HTTP $status" >&2
            exit 1
          fi
